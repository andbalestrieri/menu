<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111111">
<title>Pellegreen</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
  * {
    box-sizing: border-box;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #111;
    overflow-x: hidden;
  }
  body {
    display: flex;
    justify-content: center;
  }
  #container {
    width: min(100%, 480px);
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .page-slot {
    display: block;
    width: 100%;
    margin-bottom: 4px;
    background: #111;
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    -webkit-user-select: none;
    user-select: none;
    pointer-events: none;
  }

  /* Loader */
  #loader {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #111;
    z-index: 10;
    transition: opacity 0.3s ease;
  }
  #loader.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .spinner {
    width: 48px;
    height: 48px;
    border: 5px solid rgba(255, 255, 255, 0.2);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>
</head>
<body oncontextmenu="return false;">

<div id="loader"><div class="spinner"></div></div>
<div id="container"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  const container = document.getElementById("container");
  const loader = document.getElementById("loader");
  let pdfDoc = null;
  const dpr = window.devicePixelRatio || 1;
  const slots = [];

  function getTargetWidth() {
    return container.clientWidth;
  }

  function computeScale(baseViewport) {
    const targetWidth = getTargetWidth();
    const fitWidthScale = targetWidth / baseViewport.width;
    return Math.min(fitWidthScale, 1) * dpr;
  }

  let firstPageRendered = false;

function renderPageIntoSlot(pageNum, slot) {
  if (slot.dataset.rendered === "1") return;
  pdfDoc.getPage(pageNum).then(page => {
    const baseViewport = page.getViewport({ scale: 1 });
    const scale = computeScale(baseViewport);
    const viewport = page.getViewport({ scale });

    const canvas = document.createElement("canvas");
    canvas.width = viewport.width;
    canvas.height = viewport.height;

    slot.appendChild(canvas);
    slot.dataset.rendered = "1";

    const ctx = canvas.getContext("2d");
    page.render({ canvasContext: ctx, viewport: viewport }).promise.then(() => {
      if (pageNum === 1 && !firstPageRendered) {
        firstPageRendered = true;
        hideLoader();
      }
    });
  });
}
  function createSlots() {
    const promises = [];
    for (let i = 1; i <= pdfDoc.numPages; i++) {
      promises.push(pdfDoc.getPage(i).then(page => {
        const baseViewport = page.getViewport({ scale: 1 });

        const slot = document.createElement("div");
        slot.className = "page-slot";
        slot.style.aspectRatio = (baseViewport.width / baseViewport.height);
        slot.dataset.pageNum = i;
        container.appendChild(slot);
        slots[i - 1] = slot;
      }));
    }
    return Promise.all(promises);
  }

  function setupLazyLoading() {
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const pageNum = parseInt(entry.target.dataset.pageNum, 10);
          renderPageIntoSlot(pageNum, entry.target);
        }
      });
    }, { rootMargin: "800px 0px" });

    slots.forEach(slot => observer.observe(slot));
  }

  function hideLoader() {
    loader.classList.add("hidden");
    setTimeout(() => loader.remove(), 300);
  }

  async function getVersionedUrl() {
    try {
      const res = await fetch("menu.pdf", { method: "HEAD", cache: "no-store" });
      const tag = res.headers.get("etag") || res.headers.get("last-modified");
      if (tag) {
        return "menu.pdf?v=" + encodeURIComponent(tag);
      }
    } catch (e) {
      console.warn("Impossibile leggere la versione del PDF, procedo senza cache-buster", e);
    }
    return "menu.pdf";
  }

  getVersionedUrl().then(url => {
    pdfjsLib.getDocument(url).promise.then(pdf => {
      pdfDoc = pdf;
      createSlots().then(() => {
        setupLazyLoading();
      });
    });
  });
</script>

</body>
</html>
