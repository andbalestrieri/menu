<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Pellegreen bar</title>

<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    background: #111;
    overflow-x: hidden;
    align-items: center;
  }
  #container {
    width: min(100%, 480px);
    display: flex;
    flex-direction: column;
    align-items: center;   /* centra se il documento è più piccolo dello schermo */
  }
  canvas {
    display: block;
    margin-bottom: 4px;
    -webkit-user-select: none;
    user-select: none;
    pointer-events: none;
    max-width: 100%;  /* non supera mai la larghezza schermo */
  }
</style>
</head>

<body oncontextmenu="return false;">

<div id="container"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  const url = "menu.pdf";
  const container = document.getElementById("container");
  let pdfDoc = null;
  const dpr = window.devicePixelRatio || 1;
  const slots = [];

  // Legge la larghezza REALE del contenitore (dopo che il CSS/max-width
  // è stato applicato), non quella della finestra
  function getTargetWidth() {
    return container.clientWidth;
  }

  function computeScale(baseViewport) {
    const targetWidth = getTargetWidth();
    const fitWidthScale = targetWidth / baseViewport.width;
    return Math.min(fitWidthScale, 1) * dpr;
    // Nota: Math.min(..., 1) evita l'upscale se il PDF nella sua
    // dimensione naturale è già più piccolo del contenitore
  }

  function renderPageIntoSlot(pageNum, slot) {
    if (slot.dataset.rendered === "1") return;
    pdfDoc.getPage(pageNum).then(page => {
      const baseViewport = page.getViewport({ scale: 1 });
      const scale = computeScale(baseViewport);
      const viewport = page.getViewport({ scale });

      const canvas = document.createElement("canvas");
      canvas.width = viewport.width;
      canvas.height = viewport.height;

      slot.appendChild(canvas);
      slot.dataset.rendered = "1";

      const ctx = canvas.getContext("2d");
      page.render({ canvasContext: ctx, viewport: viewport });
    });
  }

  function createSlots() {
    const promises = [];
    for (let i = 1; i <= pdfDoc.numPages; i++) {
      promises.push(pdfDoc.getPage(i).then(page => {
        const baseViewport = page.getViewport({ scale: 1 });
        const scale = computeScale(baseViewport);
        const viewport = page.getViewport({ scale });

        const slot = document.createElement("div");
        slot.className = "page-slot";
        // aspect-ratio mantiene lo spazio corretto anche prima del rendering
        slot.style.aspectRatio = (viewport.width / viewport.height);
        slot.dataset.pageNum = i;
        container.appendChild(slot);
        slots[i - 1] = slot;
      }));
    }
    return Promise.all(promises);
  }

  function setupLazyLoading() {
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const pageNum = parseInt(entry.target.dataset.pageNum, 10);
          renderPageIntoSlot(pageNum, entry.target);
        }
      });
    }, { rootMargin: "800px 0px" });

    slots.forEach(slot => observer.observe(slot));
  }

  pdfjsLib.getDocument(url).promise.then(pdf => {
    pdfDoc = pdf;
    createSlots().then(setupLazyLoading);
  });
</script>
</body>
</html>
