<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Pellegreen bar1</title>

<<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    background: #111;
    overflow: hidden; /* niente scroll sul body */
  }
  #container {
    height: 100vh;
    width: 100vw;
    display: flex;
    align-items: center;      /* centra verticalmente (non serve scrollare qui) */
    justify-content: flex-start; /* parte da sinistra, si scrolla verso destra */
    overflow-x: auto;   /* scroll orizzontale se il documento è più largo */
    overflow-y: hidden;  /* niente scroll verticale, mai */
  }
  canvas {
    height: 100vh;   /* riempie sempre l'altezza dello schermo */
    width: auto;     /* la larghezza segue le proporzioni del PDF */
    display: block;
    -webkit-user-select: none;
    user-select: none;
    pointer-events: none;
  }
</style>
</head>

<body oncontextmenu="return false;">

<div id="container"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  const url = "menu.pdf?v=" + Date.now();
  const container = document.getElementById("container");

  pdfjsLib.getDocument(url).promise.then(pdf => {
    for (let i = 1; i <= pdf.numPages; i++) {
      pdf.getPage(i).then(page => {
        const scale = 2; // qualità immagine
        const viewport = page.getViewport({ scale });
        const canvas = document.createElement("canvas");
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        container.appendChild(canvas);
        const ctx = canvas.getContext("2d");
        page.render({ canvasContext: ctx, viewport: viewport });
      });
    }
  });
</script>

</body>
</html>
