<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pellegreen bar</title>
<style>
  * {
    box-sizing: border-box;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #111;
    overflow-x: hidden;
  }
  body {
    display: flex;
    justify-content: center; /* centra il container orizzontalmente */
  }
  #container {
    /* Su schermi piccoli riempie tutto, su schermi grandi si ferma a 480px.
       Modifica questo valore se vuoi che sia più grande/piccolo su desktop. */
    width: min(100%, 480px);
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .page-slot {
    display: block;
    width: 100%;
    margin-bottom: 4px;
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    -webkit-user-select: none;
    user-select: none;
    pointer-events: none;
  }
</style>
</head>
<body oncontextmenu="return false;">

<div id="container"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  const container = document.getElementById("container");
  let pdfDoc = null;
  const dpr = window.devicePixelRatio || 1;
  const slots = [];

  // Legge la larghezza reale del contenitore (dopo che il CSS/max-width è stato applicato)
  function getTargetWidth() {
    return container.clientWidth;
  }

  function computeScale(baseViewport) {
    const targetWidth = getTargetWidth();
    const fitWidthScale = targetWidth / baseViewport.width;
    // Math.min(..., 1) evita l'upscale se il PDF è già più piccolo del contenitore
    return Math.min(fitWidthScale, 1) * dpr;
  }

  function renderPageIntoSlot(pageNum, slot) {
    if (slot.dataset.rendered === "1") return;
    pdfDoc.getPage(pageNum).then(page => {
      const baseViewport = page.getViewport({ scale: 1 });
      const scale = computeScale(baseViewport);
      const viewport = page.getViewport({ scale });

      const canvas = document.createElement("canvas");
      canvas.width = viewport.width;
      canvas.height = viewport.height;

      slot.appendChild(canvas);
      slot.dataset.rendered = "1";

      const ctx = canvas.getContext("2d");
      page.render({ canvasContext: ctx, viewport: viewport });
    });
  }

  function createSlots() {
    const promises = [];
    for (let i = 1; i <= pdfDoc.numPages; i++) {
      promises.push(pdfDoc.getPage(i).then(page => {
        const baseViewport = page.getViewport({ scale: 1 });

        const slot = document.createElement("div");
        slot.className = "page-slot";
        // aspect-ratio riserva lo spazio corretto anche prima del rendering,
        // evitando "salti" di layout durante lo scroll
        slot.style.aspectRatio = (baseViewport.width / baseViewport.height);
        slot.dataset.pageNum = i;
        container.appendChild(slot);
        slots[i - 1] = slot;
      }));
    }
    return Promise.all(promises);
  }

  function setupLazyLoading() {
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const pageNum = parseInt(entry.target.dataset.pageNum, 10);
          renderPageIntoSlot(pageNum, entry.target);
        }
      });
    }, { rootMargin: "800px 0px" }); // inizia a renderizzare un po' prima che sia visibile

    slots.forEach(slot => observer.observe(slot));
  }

  // Determina un URL "versionato" leggendo gli header del server (ETag /
  // Last-Modified), che cambiano automaticamente ogni volta che sostituisci
  // menu.pdf su GitHub. Così il browser usa la cache quando il file non è
  // cambiato, e lo riscarica solo quando è davvero diverso — senza dover
  // mai toccare questo file manualmente.
  async function getVersionedUrl() {
    try {
      const res = await fetch("menu.pdf", { method: "HEAD", cache: "no-store" });
      const tag = res.headers.get("etag") || res.headers.get("last-modified");
      if (tag) {
        return "menu.pdf?v=" + encodeURIComponent(tag);
      }
    } catch (e) {
      console.warn("Impossibile leggere la versione del PDF, procedo senza cache-buster", e);
    }
    return "menu.pdf"; // fallback se gli header non sono disponibili
  }

  getVersionedUrl().then(url => {
    pdfjsLib.getDocument(url).promise.then(pdf => {
      pdfDoc = pdf;
      createSlots().then(setupLazyLoading);
    });
  });
</script>

</body>
</html>
