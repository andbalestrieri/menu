<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menù</title>

    <style> * { margin: 0; padding: 0; box-sizing: border-box; } 
        html, 
        body { width: 100%; min-height: 100%; background: #fff; } 
        .page { width: 100%; max-width: 1080px; height: auto; display: block; margin: 0 auto; } 
    </style>
</head>

<body>
    <main><img class="page" src="test.webp"></img></main>
</body>

<script>
        const menu = document.getElementById('menu');
        const error = document.getElementById('error');
        async function loadMenu() {
            try {
                const url = `menu.webp?_=${Date.now()}`;

                const response = await fetch(url, {
                    method: 'GET',
                    cache: 'no-store',
                    headers: {
                        'Cache-Control': 'no-cache, no-store, must-revalidate',
                        'Pragma': 'no-cache'
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const blob = await response.blob();
                const objectUrl = URL.createObjectURL(blob);

                menu.onload = () => {
                    URL.revokeObjectURL(objectUrl);
                };

                menu.src = objectUrl;

            } catch (e) {
                console.error('Errore caricamento menu:', e);
                menu.style.display = 'none';
                error.style.display = 'block';
            }
        }

        loadMenu();
    </script>
</html>
